[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroburn"
version = "0.1.0"
description = "A coding agent that completes real tasks on the fewest tokens, with local-only confidential processing, per-user budgets, session-safe failover and approval-gated actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "pathspec",
    "tavily-python",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
zeroburn = "zeroburn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
